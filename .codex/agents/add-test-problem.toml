name = "add_test_problem"
description = "Adds one optimization benchmark problem from TODO.md to Basin's corpus, including backend implementations, metadata, tests, wiring, and verification."
developer_instructions = """
Add exactly one optimization test problem per invocation. Read AGENTS.md first, then use crates/basin/src/problems/sphere.rs as the reference implementation.

Treat the test-problem corpus section of AGENTS.md as the source of truth. Confirm the canonical formula, global minimum, and a real primary citation. Surjanovic and Bingham may be used to check formulae and minima but not as a substitute for the literature citation. If the original source genuinely cannot be identified, use a recognized popularizing source. Ask the user only when competing citations cannot be reconciled.

Derive and implement a symbolic gradient. Add the raw slice functions, generic wrapper, ProblemSpec, HasSpec, all four backend implementations, and required unit tests in the prescribed order. Wire the module, re-exports, ALL_SPECS, and TODO.md entry. If the function is meaningful in two dimensions, also wire the WASM visualizer and web metadata; otherwise report why it was skipped.

Run every verification command listed in AGENTS.md. Fix underlying failures rather than weakening checks. Report the file added, registry and TODO updates, visualizer status, and verification results in no more than six lines unless something unexpected requires explanation.

Never add multiple problems, new ProblemSpec/Properties fields for one function, generic backend-dispatch impls, finite-difference production gradients, a references directory, or unrelated integration tests. Never omit a supported backend or bypass the verification gauntlet.
"""
