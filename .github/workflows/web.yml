name: Website

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]
  release:
    types: [published]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Builds on different release lines do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Pages builds don't share a cache with the per-feature CI matrix.
          key: web-wasm

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        # --config.minimumReleaseAge=0 disables pnpm's supply-chain freshness
        # gate in CI only. Dependabot opens bumps the moment a release lands,
        # so the gate (which rejects packages younger than its cutoff) would
        # otherwise fail every dep PR until the package ages out. The gate
        # stays on for local installs, where it's the actual protection layer.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build site
        working-directory: web
        # No BASIN_BASE_PATH: the site is served at the root of the apex
        # custom domain (basin.rs), so kit.paths.base stays empty. (Repo
        # Pages sites under /<repo>/ would set it; the custom domain does
        # not.)
        run: pnpm run build

      - name: Test Markdown negotiation
        working-directory: web
        run: pnpm run test:markdown

      # Check API links against this revision, including APIs that have not
      # reached docs.rs yet. Only the site's HTML is scanned for links.
      - name: Build API link targets
        run: >-
          cargo doc --no-deps -p basin
          --features nalgebra_latest-lapack,ndarray_latest-blas,faer_latest,parallel,problems,serde

      - name: Check website links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config web/lychee.toml
            --remap '^https://basin\.rs/ file://${{ github.workspace }}/web/build/'
            --remap '^https://docs\.rs/basin/latest/basin/ file://${{ github.workspace }}/target/doc/basin/'
            'web/build/**/*.html'
          output: ${{ runner.temp }}/lychee-report.md
          fail: true

      - name: Add .nojekyll
        run: touch web/build/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        if: >-
          (github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        with:
          path: web/build

  deploy:
    needs: build
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check after waiting for other deployments so an older build cannot
      # replace the documentation for a newer stable release.
      - name: Select the current stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$GITHUB_REF" == refs/tags/* &&
                "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
                "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment of $GITHUB_REF_NAME; current stable release is $latest_tag."
          fi
      - id: deployment
        if: steps.stable.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
