name: Website

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]
  release:
    types: [published]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable tag to redeploy with this workflow (leave empty to check the selected ref)'
        type: string
        required: false

# Builds on different release lines do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOSTING_DIRECTORY: ${{ inputs.release_tag != '' && '.hosting/web' || 'web' }}
    permissions:
      contents: read
    steps:
      - name: Validate requested release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$REQUESTED_TAG" != "$latest_tag" ]]; then
            echo "Only the current stable release ($latest_tag) can be redeployed."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      # Older tags retain their original deployment configuration. Use the
      # selected workflow revision's hosting tools when redeploying them.
      - name: Check out hosting tools
        if: inputs.release_tag != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .hosting
          sparse-checkout: web

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Website builds don't share a cache with the per-feature CI matrix.
          key: web-wasm

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        # --config.minimumReleaseAge=0 disables pnpm's supply-chain freshness
        # gate in CI only. Dependabot opens bumps the moment a release lands,
        # so the gate (which rejects packages younger than its cutoff) would
        # otherwise fail every dep PR until the package ages out. The gate
        # stays on for local installs, where it's the actual protection layer.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build site
        working-directory: web
        run: pnpm run build

      - name: Prepare release for Workers
        if: inputs.release_tag != ''
        working-directory: .hosting/web
        run: |
          pnpm install --frozen-lockfile --config.minimumReleaseAge=0
          cp -R "$GITHUB_WORKSPACE/web/build" build
          node scripts/build-markdown.mjs

      - name: Test Markdown negotiation
        working-directory: ${{ env.HOSTING_DIRECTORY }}
        run: pnpm run test:markdown

      # Check API links against this revision, including APIs that have not
      # reached docs.rs yet. Only the site's HTML is scanned for links.
      - name: Build API link targets
        run: >-
          cargo doc --no-deps -p basin
          --features nalgebra_latest-lapack,ndarray_latest-blas,faer_latest,parallel,problems,serde

      - name: Check website links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config web/lychee.toml
            --remap '^https://basin\.rs/ file://${{ github.workspace }}/web/build/'
            --remap '^https://docs\.rs/basin/latest/basin/ file://${{ github.workspace }}/target/doc/basin/'
            'web/build/**/*.html'
          output: ${{ runner.temp }}/lychee-report.md
          fail: true

      - name: Validate Worker deployment
        working-directory: ${{ env.HOSTING_DIRECTORY }}
        run: pnpm run deploy:check

      - uses: actions/upload-artifact@v7
        if: >-
          (github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''))
        with:
          name: website
          path: ${{ env.HOSTING_DIRECTORY }}/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''))
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-workers
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
      url: https://basin.rs/
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - uses: actions/download-artifact@v8
        with:
          name: website
          path: web/build

      # Check after waiting for other deployments so an older build cannot
      # replace the documentation for a newer stable release.
      - name: Select the current stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
                "$DEPLOY_TAG" == "$latest_tag" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment of $DEPLOY_TAG; current stable release is $latest_tag."
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.stable.outputs.deploy == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
