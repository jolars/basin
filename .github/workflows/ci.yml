name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clippy
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # rustdoc lints (broken links, redundant targets, missing docs, ...)
      # are warnings by default; -D promotes them to hard errors so docs
      # can't rot. Built with --all-features to exercise the feature-gated
      # backend impls, mirroring the docs.rs config.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps -p basin --all-features

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: nalgebra
            flags: "--features nalgebra"
          - features: ndarray
            flags: "--features ndarray"
          - features: faer
            flags: "--features faer"
          # Exercise the rayon-backed `parallel` path (FiniteDiff probe
          # fan-out). Matrix backends are needed for the FD Jacobian/Hessian
          # tests; faer + nalgebra cover both.
          - features: parallel
            flags: "--features nalgebra,faer,parallel"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - run: cargo build -p basin ${{ matrix.flags }}
      - run: cargo test -p basin ${{ matrix.flags }}

  # `nalgebra-lapack` is the one feature that links a system LAPACK, so it gets
  # its own job rather than a matrix row (and is absent from the wasm matrix —
  # it must never build for wasm). The feature forwards `lapack-custom`, so the
  # LAPACK symbols are supplied here at link time by Ubuntu's LP64 OpenBLAS
  # (`libopenblas-dev`). The integer width matters: the LP64 build (32-bit int)
  # matches `lapack-sys`; the ILP64 build segfaults at runtime.
  lapack:
    name: test (nalgebra-lapack)
    runs-on: ubuntu-latest
    env:
      # Override the workflow-level RUSTFLAGS (job env replaces, not merges), so
      # keep `-D warnings` and append the OpenBLAS link directive.
      RUSTFLAGS: "-D warnings -l openblas"
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenBLAS (LP64)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: nalgebra-lapack
      - run: cargo test -p basin --features nalgebra-lapack --test lapack_nalgebra

  wasm:
    name: wasm build (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: nalgebra
            flags: "--features nalgebra"
          - features: ndarray
            flags: "--features ndarray"
          - features: faer
            flags: "--features faer"
    steps:
      - uses: actions/checkout@v7
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ matrix.features }}
      - run: cargo build -p basin --target wasm32-unknown-unknown ${{ matrix.flags }}
      # Regression guard: the bare workspace command (no `-p`) must build on wasm
      # too. It builds the `default-members` set (basin + basin-wasm), which keeps
      # `competitor-bench` — a native-only bench crate whose `getrandom 0.3` dep
      # has no wasm backend — out of the default build. Run once (default entry).
      - name: Bare workspace wasm build
        if: matrix.features == 'default'
        run: cargo build --target wasm32-unknown-unknown

  snippets:
    name: playground snippets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: snippets
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        # See web.yml for why the freshness gate is disabled in CI.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      # Generates every snippet the landing-page playground can produce and
      # builds them against the in-repo basin crate, so the demo can't drift
      # from the real API.
      - name: Compile generated snippets
        working-directory: web
        run: pnpm run check:snippets

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - id: versionary
        uses: jolars/versionary@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
