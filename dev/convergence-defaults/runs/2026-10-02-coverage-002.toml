id = "2026-10-02-coverage-002"
status = "complete"
purpose = "Validate expanded fixtures and baseline recording; no default selection."
protocol = "../protocol.md (proposed, not frozen)"
coverage = "../coverage.md"
starting_revision = "7065d6d4d94048d9a01f4c176352cf6447c2b301"
working_tree = "fixture, runner, and documentation additions recorded in source hashes"
source_hashes = "2026-10-02-coverage-002.sources.sha256"
compiler = "rustc 1.89.0 (29483883e 2025-08-04)"
profile = "release"
target = "x86_64-linux"
features = "competitor-bench defaults; basin nalgebra_v0_34, faer, problems"
precision = ["f32", "f64"]
backend = "Vec for vector cases; scalar otherwise"
partition = "development only; no --include-validation"
case_list = "../cases.csv"
root_cases = "../scalar-roots.csv"
minimum_cases = "../scalar-minima.csv"
replications = 1
launch = "Six independent suite processes ran concurrently; elapsed times are not performance comparisons."
seeds = "SGD: 0..19, paired across starts and precisions"
sgd = "alpha=0.02, batch_size=1; other constructor defaults"
max_iter = "200 for optimization; 100 by default for roots"
max_passes = "2000 for optimization, checked at published boundaries with recorded overshoot"
settings = "Constructor defaults except required SGD controls and external budgets"
reference = "NIST certificates and analytic/reference answers; see coverage.md"
derivatives = "Forward differentiation or explicit scalar derivatives; never finite-difference production gradients"
quality = "Independent f64 reevaluation of returned parameters; no target scoring or validated precision floors"
accounting = "Authoritative Stepper counts, physical value/derivative passes, and solver-only timing"
schema = "convergence-boundaries-v1; convergence-roots-v1"
build_command = "CARGO_INCREMENTAL=0 cargo build --release -p competitor-bench --bin convergence_suite --bin convergence_scalar"
validation_command = "CARGO_INCREMENTAL=0 cargo test --release -p competitor-bench --lib --bin convergence_suite --bin convergence_scalar --bin convergence_pilot"

[[runs]]
name = "nist"
command = "target/release/convergence_suite --suite nist > target/convergence-defaults/2026-10-02-coverage-002/nist.csv"
output = "target/convergence-defaults/2026-10-02-coverage-002/nist.csv"
output_sha256 = "e5b7eb4cb9c75cc2bfe0a575cb067c8db4938f6c75dd286ce8c9281aed989e0b"
rows = 29054
solves = 256

