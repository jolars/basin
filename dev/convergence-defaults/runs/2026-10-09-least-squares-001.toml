analytic_fixtures = ["linear residual x-1", "nonzero residual 1+(x-1)^2", "nonfinite trial outside [0,1.1]", "linear physical caps 0/1/2", "LM relative measurement probes"]
analytic_start = 0.1
analytic_physical_cap = 4000
corpus_physical_cap = "2000*(n+1)"
iteration_cap = 10000
