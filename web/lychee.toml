# Run from the repository root after building the site and API documentation.
# The build output is ignored by Git but must be scanned for links.
no_ignore = true
no_progress = true
root_dir = "web/build"
index_files = ["index.html"]
include_fragments = "anchor-only"

max_concurrency = 8
max_retries = 2
timeout = 20

# This GSL manual page repeatedly times out or resets connections, even with
# serialized requests and a custom User-Agent. Exclude only this page so its
# availability cannot block website builds.
exclude = ['^https://www\.gnu\.org/software/gsl/doc/html/roots\.html(?:#.*)?$']

# mdsvex marks external links as nofollow, which lychee otherwise skips.
preprocess = { command = "web/scripts/lychee-preprocess.sh" }

# Publishers often block automated HTML requests. DOI content negotiation
# validates the identifier through its registration agency instead.
[hosts."doi.org"]
headers = { Accept = "application/vnd.citationstyles.csl+json" }
# Crossref's public API allows one concurrent request, including redirects
# from DOI content negotiation. Keep each complete request chain serial.
concurrency = 1
request_interval = "1s"
