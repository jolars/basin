[workspace]
resolver = "3"

[package]
name = "checkpoint-codecs"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = ["serde-codecs"]
serde-codecs = [
  "basin/ndarray_v0_17",
  "basin/serde",
  "bincode-next/serde",
  "dep:ndarray",
  "dep:postcard",
  "dep:rmp-serde",
  "dep:serde",
]
bench = ["serde-codecs", "dep:criterion"]

[dependencies]
basin = { path = "../../..", default-features = false }
bincode-next = "=3.2.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"], optional = true }
ndarray = { version = "=0.17.2", optional = true }
postcard = { version = "=1.1.3", features = ["alloc"], default-features = false, optional = true }
rmp-serde = { version = "=1.3.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
rkyv = "=0.8.18"
wincode = { version = "=0.6.3", features = ["derive"] }

[[bench]]
name = "payload"
harness = false
required-features = ["bench"]
