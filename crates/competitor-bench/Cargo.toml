# Non-published benchmark harness comparing basin against competing
# optimization libraries (axis 3 of the bench plan): the
# `levenberg-marquardt` crate for NLLS, `argmin` and `gomez` for the
# gradient-based and derivative-free solvers, and `nlopt` (a C-linked
# wrapper around NLopt 2.9.1) on the derivative-free/L-BFGS cases.
# These external frameworks (and criterion) have no business in basin
# proper—so per CONTRIBUTING.md ("a new member should pull in heavy
# deps that have no business in the core crate") they live here,
# isolated from basin's own dependency graph, MSRV gate, and the wasm
# build (CI scopes those to `-p basin`).
#
# Backend-vs-backend (axis 1) and solver-vs-solver (axis 2) benchmarks
# are basin-internal and live in `crates/basin/benches/` instead.
#
# The lm crate (0.15) and basin both use nalgebra ^0.34, so the shared
# workspace lockfile pins them to the *same* nalgebra patch: comparing
# the lm crate against basin's nalgebra backend isolates pure
# solver-loop overhead with zero linear-algebra-library confound. argmin
# and gomez are compared on the `Vec<f64>` backend, which basin, argmin,
# and gomez (via its bundled `gomez::nalgebra` re-export, 0.32) all
# support natively, so NM/GD run on identical param types.
[package]
name = "competitor-bench"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
basin = { path = "../basin", features = ["nalgebra", "faer", "problems"] }
levenberg-marquardt = "0.15"
nalgebra = "0.34"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
# argmin on its default `Vec<f64>` backend. default-features keeps the
# `vec` math impls (via argmin-math) and `rand`; we don't enable any
# per-version backend feature (the explosion basin's tenet 2 avoids).
argmin = "0.11"
argmin-math = { version = "0.5", features = ["vec"] }
# gomez bundles its own nalgebra (0.32). That's a major mismatch with
# the lm/basin nalgebra (0.34) elsewhere in this crate, but gomez is
# used standalone—its `Function` trait takes a `gomez::nalgebra::DVector`,
# never a basin/lm type—so the two nalgebra majors coexist in the
# lockfile without interacting.
gomez = "0.5"
# nlopt wraps the NLopt C library (statically linked, vendored via
# nlopt-sys bundling NLopt 2.9.1)—needs `cmake` at build time (added
# to devenv.nix). NLopt has no per-iteration callback; the objective
# closure is the only observation point, so the trace harness records a
# best-so-far curve at function-eval granularity—vs the per-iteration
# curves the other libraries report (see trace.rs for the asymmetry
# note). LGPL-2.1, but `publish = false` keeps it from ever propagating
# to basin proper or the wasm build.
nlopt = "0.8"
# Pulled in only by the `parallel` feature: lets the population-scaling
# bench query the active rayon pool size (`current_num_threads`) so each
# run self-reports whether it is in the serial (`RAYON_NUM_THREADS=1`) or
# all-cores configuration. basin's own `parallel` feature pins the same
# rayon major.
rayon = { version = "1", optional = true }

[features]
# Off by default so the axis-3 competitor benches (`compare`, `gd_nm`)
# compile basin *without* rayon—a single-threaded basin vs a
# single-threaded argmin/lm/gomez/nlopt, with no parallelism confound.
# Enabling it turns on basin's population-eval parallelism and unlocks the
# `population_scaling` bench, which compares serial vs parallel *within one
# build* by varying `RAYON_NUM_THREADS` across two runs.
parallel = ["basin/parallel", "dep:rayon"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "gd_nm"
harness = false

# Serial-vs-parallel scaling of basin's population solvers (axis 4:
# basin-internal, but co-located here for the criterion + heavy-dep setup).
# Requires the `parallel` feature; skipped by a plain `cargo bench`.
[[bench]]
name = "population_scaling"
harness = false
required-features = ["parallel"]
